plugins {
    alias(libs.plugins.android.application)
    id 'org.jetbrains.kotlin.android'
    id("com.google.gms.google-services")
    id("com.google.devtools.ksp")
}
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def versionProperties = new Properties()
def versionPropertiesFile = rootProject.file('version.properties')
if (versionPropertiesFile.exists()) {
    versionPropertiesFile.withInputStream { versionProperties.load(it) }
}

// Optional: ./gradlew bumpVersion  (or assembleRelease -PincVersion)
if (project.hasProperty('incVersion')) {
    def code = (versionProperties['VERSION_CODE'] ?: '1').toInteger() + 1
    def name = versionProperties['VERSION_NAME'] ?: '1.0'
    def parts = name.tokenize('.')
    if (parts.size() >= 2) {
        parts[parts.size() - 1] = (parts.last().toInteger() + 1).toString()
        name = parts.join('.')
    } else {
        name = "${name}.1"
    }
    versionProperties['VERSION_CODE'] = code.toString()
    versionProperties['VERSION_NAME'] = name
    versionPropertiesFile.withWriter { versionProperties.store(it, 'Bump before Play upload') }
    println "Bumped to versionName=${name} versionCode=${code}"
}

def versionCodeValue = (versionProperties['VERSION_CODE'] ?: '1').toInteger()
def versionNameValue = versionProperties['VERSION_NAME'] ?: '1.0'

// Web OAuth client (type 3) from Firebase — required for Google → Firebase idToken.
def rawWebClientId = (localProperties.getProperty('WEB_CLIENT_ID')
        ?: '209820622367-4frpduthbniq2qpiki1adc8qq0boasr0.apps.googleusercontent.com')
        .replaceAll(/^"|"$/, '')
def webClientId = "\"${rawWebClientId}\""
def facebookAppId = localProperties.getProperty('FACEBOOK_APP_ID')
def facebookClientToken = localProperties.getProperty('FACEBOOK_CLIENT_TOKEN')
def fbLoginScheme = localProperties.getProperty('FB_LOGIN_PROTOCOL_SCHEME')

android {
    namespace 'com.app.nisisiafrica'
    compileSdk 35

    defaultConfig {
        applicationId "com.app.nisisiafrica"
        minSdk 26
        targetSdk 35
        versionCode versionCodeValue
        versionName versionNameValue

//        buildConfigField "String", "WEB_CLIENT_ID", "\"${WEB_CLIENT_ID}\""
        buildConfigField "String", "WEB_CLIENT_ID", webClientId
        resValue "string", "facebook_app_id", "\"${facebookAppId}\""
        resValue "string", "facebook_client_token", "\"${facebookClientToken}\""
        resValue "string", "fb_login_protocol_scheme", "\"${fbLoginScheme}\""

        resValue "string", "app_name", "Nelsen Savannah"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }


    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    ksp {
        arg("room.schemaLocation", "$projectDir/schemas")
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
    packaging {
        resources {
            excludes += [
                    "META-INF/versions/9/OSGI-INF/MANIFEST.MF"
            ]
        }
        jniLibs {
            // AGP 8.5.1+: keep .so uncompressed + 16 KB zip-aligned (Play / Android 15+).
            useLegacyPackaging = false
        }
    }
}

