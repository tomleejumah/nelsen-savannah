// Didit pulls older CameraX / MediaPipe .so builds that are only 4 KB aligned.
configurations.configureEach {
    exclude group: "com.github.mhiew", module: "pdfium-android"
    exclude group: "com.github.mhiew", module: "android-pdf-viewer"
    // RootEncoder's SRT stack brings the parallel jdk15to18 provider while
    // Didit already uses the jdk18on Bouncy Castle line. Keep one provider
    // to avoid duplicate org.bouncycastle classes in the APK.
    exclude group: "org.bouncycastle", module: "bcprov-jdk15to18"
    exclude group: "org.bouncycastle", module: "bcutil-jdk15to18"
    exclude group: "org.bouncycastle", module: "bcpkix-jdk15to18"
    exclude group: "org.bouncycastle", module: "bctls-jdk15to18"
    resolutionStrategy {
        force(
                "org.bouncycastle:bcprov-jdk18on:1.84",
                "org.bouncycastle:bcutil-jdk18on:1.84",
                "org.bouncycastle:bcpkix-jdk18on:1.84",
                "org.bouncycastle:bctls-jdk18on:1.84",
                "androidx.camera:camera-core:1.5.3",
                "androidx.camera:camera-camera2:1.5.3",
                "androidx.camera:camera-lifecycle:1.5.3",
                "androidx.camera:camera-view:1.5.3",
                "com.google.mediapipe:tasks-vision:0.10.26.1",
                "io.github.oothp:pdfium-android:1.9.5-beta01",
        )
    }
}

tasks.register('bumpVersion') {
    group = 'versioning'
    description = 'Increment VERSION_CODE and patch VERSION_NAME in version.properties'
    doLast {
        def file = rootProject.file('version.properties')
        def props = new Properties()
        if (file.exists()) file.withInputStream { props.load(it) }
        def code = (props['VERSION_CODE'] ?: '1').toInteger() + 1
        def name = props['VERSION_NAME'] ?: '1.0'
        def parts = name.tokenize('.')
        if (parts.size() >= 2) {
            parts[parts.size() - 1] = (parts.last().toInteger() + 1).toString()
            name = parts.join('.')
        } else {
            name = "${name}.1"
        }
        props['VERSION_CODE'] = code.toString()
        props['VERSION_NAME'] = name
        file.withWriter { props.store(it, 'Bump before Play upload') }
        println "Bumped to versionName=${name} versionCode=${code}"
    }
}