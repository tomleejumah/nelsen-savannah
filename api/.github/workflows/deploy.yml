name: Deploy Nisisi-Africa
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Deploy notification service
        run: |
          /usr/local/bin/pm2 stop nisisi-africa || true
          rsync -av --delete --exclude 'node_modules' --exclude '.env' --exclude 'firebase-service-account.json' "${GITHUB_WORKSPACE}/" /home/server/WebHooks/Nisisi-Africa/
          cd /home/server/WebHooks/Nisisi-Africa/
          rm -rf node_modules
          npm install --production
          mkdir -p data uploads uploads/_tmp
          /usr/local/bin/pm2 start src/app.js --name nisisi-africa || /usr/local/bin/pm2 restart nisisi-africa
