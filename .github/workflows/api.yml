name: API

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api.yml"
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the server's runtime: sql.js is used instead of
          # better-sqlite3 because the native build segfaults on Node 20.
          node-version: "20"
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install
        run: npm ci
      - name: Syntax check
        run: git ls-files '*.js' '*.mjs' | xargs -r -n1 node --check

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy API
        env:
          PM2: /usr/local/bin/pm2
          # All Node APIs live under /home/server/Apis/<name>.
          APP_DIR: /home/server/Apis/nelsen-savannah
        run: |
          # Both names would bind PORT 5002, so the old process must be deleted,
          # not stopped — a stopped process returns on `pm2 resurrect`.
          "$PM2" delete nisisi-africa || true
          "$PM2" stop nelsen-savannah || true
          mkdir -p "$APP_DIR" "$APP_DIR/data" "$APP_DIR/uploads" "$APP_DIR/uploads/_tmp"
          # Never write/replace secrets from Actions. .env + Firebase JSON are
          # server-local only until we deliberately wire GitHub Secrets later.
          rsync -av --delete \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude 'firebase-service-account.json' \
            --exclude '.github' \
            --exclude 'uploads/' \
            --exclude 'data/' \
            "${GITHUB_WORKSPACE}/api/" "$APP_DIR/"
          cd "$APP_DIR"
          if [ ! -f .env ]; then
            echo "::error::Missing $APP_DIR/.env — copy from local when ready; deploy will not create it"
            exit 1
          fi
          if [ ! -f firebase-service-account.json ]; then
            echo "::error::Missing $APP_DIR/firebase-service-account.json — deploy will not create it"
            exit 1
          fi
          rm -rf node_modules
          npm install --production
          mkdir -p data uploads uploads/_tmp
          "$PM2" start src/app.js --name nelsen-savannah || "$PM2" restart nelsen-savannah
          "$PM2" save

  smoke:
    needs: deploy
    runs-on: self-hosted
    steps:
      - name: Health smoke
        run: |
          set -euo pipefail
          # Cloudflare often returns 403 to GitHub-hosted IPs; verify on the deploy host.
          try_url() {
            local label="$1"
            shift
            local code body
            body=$(mktemp)
            code=$(curl -sS -L -o "$body" -w "%{http_code}" "$@" || echo "000")
            echo "$label -> $code"
            if [ "$code" = "200" ] && grep -Eq '"ok"[[:space:]]*:[[:space:]]*true|"status"[[:space:]]*:[[:space:]]*"OK"' "$body"; then
              rm -f "$body"
              return 0
            fi
            head -c 300 "$body" 2>/dev/null || true
            echo
            rm -f "$body"
            return 1
          }
          ok=0
          try_url "local :5002" http://127.0.0.1:5002/lms/health && ok=1
          if [ "$ok" != "1" ]; then
            try_url "local Host header" -H "Host: api.nelsen-savannah.co.ke" http://127.0.0.1/lms/health && ok=1
          fi
          if [ "$ok" != "1" ]; then
            try_url "public" --retry 3 --retry-delay 2 https://api.nelsen-savannah.co.ke/lms/health && ok=1
          fi
          test "$ok" = "1"
          echo "api smoke ok"
