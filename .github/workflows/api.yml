name: API

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api.yml"
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the server's runtime: sql.js is used instead of
          # better-sqlite3 because the native build segfaults on Node 20.
          node-version: "20"
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install
        run: npm ci
      - name: Syntax check
        run: git ls-files '*.js' '*.mjs' | xargs -r -n1 node --check

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy API
        env:
          PM2: /usr/local/bin/pm2
          # Deploy directory keeps its legacy name on purpose: renaming it is a
          # live-server move that would orphan uploads/ and data/. Do not "fix".
          APP_DIR: /home/server/WebHooks/Nisisi-Africa
        run: |
          # Both names would bind PORT 5002, so the old process must be deleted,
          # not stopped — a stopped process returns on `pm2 resurrect`.
          "$PM2" delete nisisi-africa || true
          "$PM2" stop nelsen-savannah || true
          # Directory was deleted once and broke deploy — always ensure it exists.
          mkdir -p "$APP_DIR" "$APP_DIR/data" "$APP_DIR/uploads" "$APP_DIR/uploads/_tmp"
          rsync -av --delete \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude 'firebase-service-account.json' \
            --exclude '.github' \
            --exclude 'uploads/' \
            --exclude 'data/' \
            "${GITHUB_WORKSPACE}/api/" "$APP_DIR/"
          cd "$APP_DIR"
          if [ ! -f .env ]; then
            echo "::error::Missing $APP_DIR/.env — restore secrets before deploy can start the API"
            exit 1
          fi
          rm -rf node_modules
          npm install --production
          mkdir -p data uploads uploads/_tmp
          "$PM2" start src/app.js --name nelsen-savannah || "$PM2" restart nelsen-savannah
          "$PM2" save

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Health smoke
        run: node scripts/smoke.mjs
        env:
          # Still the legacy prefix: nginx has no /nelsen-savannah block yet.
          # Flip once that location is live and returning 200.
          LMS_SMOKE_BASE: https://api.tommlyjumah.dev/nisisi-africa
