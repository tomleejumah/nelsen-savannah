name: API

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api.yml"
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api.yml"
  workflow_dispatch:

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install
        run: npm ci
      - name: Syntax check
        run: git ls-files '*.js' '*.mjs' | xargs -r -n1 node --check

  deploy:
    needs: check
    if: github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    concurrency:
      group: nelsen-self-hosted
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy API
        env:
          PM2: /usr/local/bin/pm2
          APP_DIR: /home/server/Apis/nelsen-savannah
        run: |
          set -euo pipefail
          mkdir -p "$APP_DIR" "$APP_DIR/data" "$APP_DIR/uploads" "$APP_DIR/uploads/_tmp"
          rsync -av --delete \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude 'firebase-service-account.json' \
            --exclude '.github' \
            --exclude 'uploads/' \
            --exclude '/data/' \
            "${GITHUB_WORKSPACE}/api/" "$APP_DIR/"
          cd "$APP_DIR"
          if [ ! -f .env ]; then
            echo "::error::Missing $APP_DIR/.env — copy from local when ready; deploy will not create it"
            exit 1
          fi
          if [ ! -f firebase-service-account.json ]; then
            echo "::error::Missing $APP_DIR/firebase-service-account.json — deploy will not create it"
            exit 1
          fi
          rm -rf node_modules
          npm install --omit=dev --no-audit --no-fund
          mkdir -p data uploads uploads/_tmp
          # Proven path: delete + start with explicit cwd (restart can keep a stale cwd/PORT).
          "$PM2" delete nelsen-savannah || true
          "$PM2" start src/app.js --name nelsen-savannah --cwd "$APP_DIR" --update-env
          "$PM2" save
          ok=0
          for i in $(seq 1 20); do
            if curl -sf --max-time 2 http://127.0.0.1:5002/lms/health \
              | grep -Eq '"ok"[[:space:]]*:[[:space:]]*true|"status"[[:space:]]*:[[:space:]]*"OK"'; then
              ok=1
              echo "API ready on :5002 (attempt $i)"
              break
            fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then
            echo "::error::API not ready on :5002 after deploy"
            "$PM2" status nelsen-savannah || true
            "$PM2" logs nelsen-savannah --lines 50 --nostream || true
            exit 1
          fi

      - name: Health smoke (local + nginx)
        run: |
          set -euo pipefail
          try_url() {
            local label="$1"
            shift
            local code body
            body=$(mktemp)
            code=$(curl -sS -L --max-time 15 -o "$body" -w "%{http_code}" "$@" || echo "000")
            echo "$label -> $code"
            if [ "$code" = "200" ] && grep -Eq '"ok"[[:space:]]*:[[:space:]]*true|"status"[[:space:]]*:[[:space:]]*"OK"' "$body"; then
              rm -f "$body"
              return 0
            fi
            head -c 300 "$body" 2>/dev/null || true
            echo
            rm -f "$body"
            return 1
          }
          try_url "local app :5002" http://127.0.0.1:5002/lms/health
          try_url "nginx Host" -H "Host: api.nelsen-savannah.co.ke" http://127.0.0.1/lms/health
          if try_url "public" --retry 2 --retry-delay 1 https://api.nelsen-savannah.co.ke/lms/health; then
            echo "public ok"
          else
            echo "::warning::public HTTPS failed (Cloudflare/DNS); local+nginx passed"
          fi
          echo "api smoke ok"
