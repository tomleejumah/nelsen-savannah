name: LMS smoke

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Health smoke
        run: node scripts/smoke.mjs
        env:
          LMS_SMOKE_BASE: https://api.tommlyjumah.dev/nisisi-africa
