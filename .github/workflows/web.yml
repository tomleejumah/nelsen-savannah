name: Web CI

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload static site
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/client
          retention-days: 3

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: self-hosted
    steps:
      - name: Download static site
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-dist

      - name: Deploy to nginx root
        env:
          # nginx root for nelsen-savannah.co.ke → /var/www/nelsen-savannah
          WEB_DIR: /var/www/nelsen-savannah
          # Keep a mirror for co.ke / ad-hoc syncs.
          WEB_DIR_MIRROR: /home/server/web-projects/nelsen-savannah
        run: |
          mkdir -p "$WEB_DIR" "$WEB_DIR_MIRROR"
          rsync -av --delete \
            --exclude '.git' \
            "${GITHUB_WORKSPACE}/web-dist/" "$WEB_DIR/"
          rsync -av --delete \
            --exclude '.git' \
            "${GITHUB_WORKSPACE}/web-dist/" "$WEB_DIR_MIRROR/"
          find "$WEB_DIR" "$WEB_DIR_MIRROR" -type d -exec chmod 755 {} +
          find "$WEB_DIR" "$WEB_DIR_MIRROR" -type f -exec chmod 644 {} +

  smoke:
    needs: deploy
    runs-on: self-hosted
    steps:
      - name: Live site smoke
        run: |
          set -euo pipefail
          check() {
            local label="$1"
            shift
            local code
            code=$(curl -sS -L -o /dev/null -w "%{http_code}" "$@")
            echo "$label -> $code"
            test "$code" = "200"
          }
          check "local home" -H "Host: nelsen-savannah.co.ke" http://127.0.0.1/
          check "local learning" -H "Host: nelsen-savannah.co.ke" http://127.0.0.1/learning
          check "local program" -H "Host: nelsen-savannah.co.ke" http://127.0.0.1/programs/future-safari
          check "public home" --retry 3 --retry-delay 2 https://nelsen-savannah.co.ke/
          check "public learning" --retry 3 --retry-delay 2 https://nelsen-savannah.co.ke/learning
          check "public program" --retry 3 --retry-delay 2 https://nelsen-savannah.co.ke/programs/future-safari
          echo "web smoke ok"
