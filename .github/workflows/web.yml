name: Web CI

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload static site
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/client
          retention-days: 3

  deploy:
    needs: build
    # Push to main + manual runs. PRs build only (no deploy).
    if: github.event_name != 'pull_request'
    runs-on: self-hosted
    # Share the machine with API deploy — one job at a time avoids runner _diag collisions.
    concurrency:
      group: nelsen-self-hosted
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - name: Download static site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Avoid actions/download-artifact set_output flake on this self-hosted runner.
          # Prefer curl over `gh` — the CLI is not installed on the runner host.
          mkdir -p "${GITHUB_WORKSPACE}/web-dist"
          API="https://api.github.com/repos/${{ github.repository }}"
          ARTIFACT_ID=$(curl -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API}/actions/runs/${{ github.run_id }}/artifacts" \
            | python3 -c "import json,sys; arts=json.load(sys.stdin).get('artifacts') or []; print(next((str(a['id']) for a in arts if a.get('name')=='web-dist'), ''))")
          test -n "$ARTIFACT_ID"
          curl -sSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/web-dist.zip
          unzip -qo /tmp/web-dist.zip -d "${GITHUB_WORKSPACE}/web-dist"
          rm -f /tmp/web-dist.zip
          test -n "$(ls -A "${GITHUB_WORKSPACE}/web-dist")"

      - name: Deploy to nginx root
        env:
          WEB_DIR: /var/www/nelsen-savannah
          WEB_DIR_MIRROR: /home/server/web-projects/nelsen-savannah
        run: |
          set -euo pipefail
          mkdir -p "$WEB_DIR" "$WEB_DIR_MIRROR"
          rsync -av --delete \
            --exclude '.git' \
            "${GITHUB_WORKSPACE}/web-dist/" "$WEB_DIR/"
          rsync -av --delete \
            --exclude '.git' \
            "${GITHUB_WORKSPACE}/web-dist/" "$WEB_DIR_MIRROR/"
          find "$WEB_DIR" "$WEB_DIR_MIRROR" -type d -exec chmod 755 {} +
          find "$WEB_DIR" "$WEB_DIR_MIRROR" -type f -exec chmod 644 {} +

      - name: Live site smoke (nginx + public)
        run: |
          set -euo pipefail
          check() {
            local label="$1"
            shift
            local code
            code=$(curl -sS -L --max-time 15 -o /dev/null -w "%{http_code}" "$@" || echo "000")
            echo "$label -> $code"
            test "$code" = "200"
          }
          check "nginx home" -H "Host: nelsen-savannah.co.ke" http://127.0.0.1/
          check "nginx pdf worker" -H "Host: nelsen-savannah.co.ke" http://127.0.0.1/pdf.worker.min.mjs
          check "nginx learning" -H "Host: nelsen-savannah.co.ke" http://127.0.0.1/learning
          check "nginx program" -H "Host: nelsen-savannah.co.ke" http://127.0.0.1/programs/future-safari
          if check "public home" --retry 2 --retry-delay 1 https://nelsen-savannah.co.ke/; then
            check "public pdf worker" --retry 2 --retry-delay 1 https://nelsen-savannah.co.ke/pdf.worker.min.mjs
            check "public learning" --retry 2 --retry-delay 1 https://nelsen-savannah.co.ke/learning
            check "public program" --retry 2 --retry-delay 1 https://nelsen-savannah.co.ke/programs/future-safari
          else
            echo "::warning::public HTTPS failed; nginx-local checks passed"
          fi
          echo "web smoke ok"
