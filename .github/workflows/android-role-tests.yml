name: Android Role Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-role-tests.yml"
  workflow_dispatch:

# Separate from the APK signing/publishing pipeline. PRs run only local
# unit tests; no release version bumps, installers or production deploys.
permissions:
  contents: read

concurrency:
  group: android-roles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Configure Firebase services for unit test build
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_SERVICES_JSON"
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
      - name: Run Android local role tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon
