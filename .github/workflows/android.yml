name: Android CI

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

# contents:write — version bump commit + softprops/action-gh-release tags.
permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: android
    outputs:
      version_name: ${{ steps.meta.outputs.version_name }}
      version_code: ${{ steps.meta.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json
      - name: Configure permanent release signing
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/nelsen-release.jks
          test -s app/nelsen-release.jks
          echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/nelsen-release.jks" >> "$GITHUB_ENV"
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      # Release builds must not push version commits back to a protected main.
      # A workflow-run-based version is unique and reproducible for each run.
      - name: Set release version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RELEASE_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path("version.properties")
          lines = path.read_text().splitlines()
          run_number = int(os.environ["RELEASE_RUN_NUMBER"])
          current_code = int(next(line.split("=", 1)[1] for line in lines if line.startswith("VERSION_CODE=")))
          # Existing releases have codes <= 75; keep a safe offset for future runs.
          new_code = run_number + 1000
          if new_code <= current_code:
              raise SystemExit(f"Release code {new_code} must exceed current {current_code}")
          lines = [
              f"VERSION_NAME=1.0.{run_number}" if line.startswith("VERSION_NAME=") else
              f"VERSION_CODE={new_code}" if line.startswith("VERSION_CODE=") else line
              for line in lines
          ]
          path.write_text("\\n".join(lines) + "\\n")
          print(f"Release version 1.0.{run_number} (code {new_code})")
          PY
      - name: Assemble release APK
        run: ./gradlew assembleRelease --no-daemon
      - name: Locate APK + version meta
        id: meta
        run: |
          set -euo pipefail
          echo "Release APK outputs:"
          find app/build/outputs -maxdepth 6 -type f \\( -name '*.apk' -o -name 'output-metadata.json' \\) -print || true
          APK_DIR="app/build/outputs/apk/release"
          if [ ! -d "$APK_DIR" ]; then
            echo "::error::Release APK output directory missing: $APK_DIR"
            exit 1
          fi
          APK=$(find "$APK_DIR" -type f -name '*.apk' ! -name '*-unsigned.apk' -print -quit)
          if [ -z "$APK" ]; then
            echo "::error::No signed release APK found in $APK_DIR. Check release signing and build outputs."
            exit 1
          fi
          test -s "$APK"
          cp "$APK" "${GITHUB_WORKSPACE}/nelsen-savannah.apk"
          # version.properties lives at android/
          VNAME=$(grep -E '^VERSION_NAME=' version.properties | cut -d= -f2- | tr -d '\r')
          VCODE=$(grep -E '^VERSION_CODE=' version.properties | cut -d= -f2- | tr -d '\r')
          echo "version_name=${VNAME:-1.0}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VCODE:-1}" >> "$GITHUB_OUTPUT"
          echo "Built $APK → nelsen-savannah.apk (v${VNAME:-?} code ${VCODE:-?})"
          ls -lh "${GITHUB_WORKSPACE}/nelsen-savannah.apk"
      - name: Upload APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: nelsen-savannah.apk
          retention-days: 14
          if-no-files-found: error

      # Public download page: https://github.com/<org>/<repo>/releases
      # Re-running the same VERSION_NAME updates that release’s APK asset.
      - name: Create GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.meta.outputs.version_name }}
          name: Android ${{ steps.meta.outputs.version_name }}
          body: |
            Nelsen Savannah Android APK build.

            - **versionName:** ${{ steps.meta.outputs.version_name }}
            - **versionCode:** ${{ steps.meta.outputs.version_code }}
            - **commit:** ${{ github.sha }}
            - **workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Authenticated users can also download from Learning after this APK is published to the API server.
          files: nelsen-savannah.apk
          fail_on_unmatched_files: true
          make_latest: true
          generate_release_notes: true

  publish:
    needs: build
    # Push to main + manual runs. PRs build only (no server publish).
    if: github.event_name != 'pull_request'
    runs-on: self-hosted
    concurrency:
      group: nelsen-self-hosted
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      - name: Download APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Same curl pattern as web.yml — avoid download-artifact flake on this runner.
          mkdir -p "${GITHUB_WORKSPACE}/android-apk"
          API="https://api.github.com/repos/${{ github.repository }}"
          ARTIFACT_ID=$(curl -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API}/actions/runs/${{ github.run_id }}/artifacts" \
            | python3 -c "import json,sys; arts=json.load(sys.stdin).get('artifacts') or []; print(next((str(a['id']) for a in arts if a.get('name')=='android-apk'), ''))")
          test -n "$ARTIFACT_ID"
          curl -sSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/android-apk.zip
          unzip -qo /tmp/android-apk.zip -d "${GITHUB_WORKSPACE}/android-apk"
          rm -f /tmp/android-apk.zip
          test -f "${GITHUB_WORKSPACE}/android-apk/nelsen-savannah.apk"

      - name: Install APK on API server
        env:
          APP_DIR: /home/server/Apis/nelsen-savannah
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
        run: |
          set -euo pipefail
          APK_SRC="${GITHUB_WORKSPACE}/android-apk/nelsen-savannah.apk"
          DEST_DIR="$APP_DIR/uploads/apk"
          mkdir -p "$DEST_DIR"
          SIZE=$(stat -c%s "$APK_SRC")
          SHA=$(sha256sum "$APK_SRC" | awk '{print $1}')
          UPDATED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # Atomic replace: write temp then mv
          cp "$APK_SRC" "$DEST_DIR/nelsen-savannah-latest.apk.tmp"
          mv -f "$DEST_DIR/nelsen-savannah-latest.apk.tmp" "$DEST_DIR/nelsen-savannah-latest.apk"
          python3 - <<PY
          import json, os
          meta = {
            "fileName": "nelsen-savannah-latest.apk",
            "versionName": os.environ.get("VERSION_NAME") or "1.0",
            "versionCode": int(os.environ.get("VERSION_CODE") or "1"),
            "sizeBytes": int("${SIZE}"),
            "sha256": "${SHA}",
            "updatedAt": "${UPDATED_AT}",
            "gitSha": "${{ github.sha }}",
            "runId": "${{ github.run_id }}",
          }
          path = "${DEST_DIR}/latest.json"
          tmp = path + ".tmp"
          with open(tmp, "w", encoding="utf-8") as f:
              json.dump(meta, f, indent=2)
              f.write("\n")
          os.replace(tmp, path)
          print(json.dumps(meta, indent=2))
          PY
          chmod 644 "$DEST_DIR/nelsen-savannah-latest.apk" "$DEST_DIR/latest.json"
          ls -lh "$DEST_DIR"

      - name: Smoke local metadata
        env:
          APP_DIR: /home/server/Apis/nelsen-savannah
        run: |
          set -euo pipefail
          test -f "$APP_DIR/uploads/apk/nelsen-savannah-latest.apk"
          test -f "$APP_DIR/uploads/apk/latest.json"
          python3 -c "import json; m=json.load(open('$APP_DIR/uploads/apk/latest.json')); assert m.get('fileName'); print('apk publish ok', m.get('versionName'), m.get('versionCode'))"
