plugins {
    alias(libs.plugins.android.application)
    id 'org.jetbrains.kotlin.android'
    id("com.google.gms.google-services")
}
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def webClientId = localProperties.getProperty('WEB_CLIENT_ID', '"default_web_client_id"')
def facebookAppId = localProperties.getProperty('FACEBOOK_APP_ID')
def facebookClientToken = localProperties.getProperty('FACEBOOK_CLIENT_TOKEN')
def fbLoginScheme = localProperties.getProperty('FB_LOGIN_PROTOCOL_SCHEME')

android {
    namespace 'com.app.nisisiafrica'
    compileSdk 35

    defaultConfig {
        applicationId "com.app.nisisiafrica"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"

//        buildConfigField "String", "WEB_CLIENT_ID", "\"${WEB_CLIENT_ID}\""
        buildConfigField "String", "WEB_CLIENT_ID", webClientId
        resValue "string", "facebook_app_id", "\"${facebookAppId}\""
        resValue "string", "facebook_client_token", "\"${facebookClientToken}\""
        resValue "string", "fb_login_protocol_scheme", "\"${fbLoginScheme}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.play.services.auth
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    //ui
    implementation project(':liquid_swipe')
    implementation project(':CustomSnackbarLib')
    implementation libs.core.splashscreen
    implementation libs.circleimageview
    implementation libs.swiperefreshlayout

    //firebase
    implementation(platform(libs.firebase.bom))
    implementation(libs.firebase.analytics)
    implementation libs.firebase.auth
    implementation libs.firebase.storage
    implementation libs.firebase.database
    //google cloud auth
    implementation libs.credentials
    implementation libs.credentials.play.services.auth
    implementation libs.googleid.v111

    //facebook Auth
    implementation libs.facebook.login

    // Google Identity Services
    implementation libs.play.services.auth

    // For Identity API
    implementation libs.play.services.identity

    //Room db
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"
}